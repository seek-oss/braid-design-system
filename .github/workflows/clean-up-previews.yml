name: Clean up preview site

on:
  workflow_dispatch:
  schedule:
    - cron: '00 8 * * 1'

jobs:
  delete:
    name: Clean up preview site
    runs-on: ubuntu-latest
    env:
      CI: true
      PREVIEW_DIR: preview
      DAYS_OLD: 7
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          # Full history is only needed to date preview folders that predate deployed-at.txt.
          fetch-depth: 0
          filter: blob:none

      - name: Delete old preview directories
        run: |
          set -euo pipefail
          git config --local user.name 'GitHub Actions'
          git config --local user.email 'actions@github.com'

          cutoff=$(date --date="${DAYS_OLD} days ago" +%Y-%m-%d)
          shopt -s nullglob
          for dir in ${PREVIEW_DIR}/*/; do
            stamp="${dir}deployed-at.txt"
            if [[ ! -f "$stamp" ]]; then
              # Folders published before the stamp existed are dated from their oldest commit.
              committed=$(git log --format=%cs -- "$dir" | tail -1 || true)
              if [[ -n "$committed" ]]; then
                printf '%s\n' "$committed" > "$stamp"
              fi
            fi
            deployed=$(tr -d '[:space:]' < "$stamp" || true)
            if [[ -n "$deployed" && "$deployed" < "$cutoff" ]]; then
              echo "Deleting directory $dir"
              rm -rf "$dir"
            fi
          done

          git add -A "${PREVIEW_DIR}"
          if git diff --cached --quiet; then
            echo "No preview directories to clean up"
          else
            git commit --quiet -m "Clean up old preview directories"
          fi

          git fetch origin gh-pages
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/gh-pages)" ]]; then
            git rebase origin/gh-pages
            git push origin HEAD:gh-pages
          fi
        shell: bash

      - name: Squash gh-pages history
        run: |
          set -euo pipefail
          # Each preview and master deploy adds a commit. Collapse them weekly so the
          # branch stays at one commit, while deploys between runs can still rebase.
          tip=$(git rev-parse HEAD)
          git checkout --orphan gh-pages-squashed
          git add -A
          git commit --quiet -m "Squash gh-pages history"
          git fetch origin gh-pages
          if [[ "$(git rev-parse origin/gh-pages)" != "$tip" ]]; then
            echo "gh-pages moved during squash; leaving history for the next run"
            exit 0
          fi
          git push --force origin HEAD:gh-pages
        shell: bash
