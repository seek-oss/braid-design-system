name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  release:
    name: Publish & Deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      CI: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits.
          # Filter by `blob:none` to avoid downloading unnecessary file contents.
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.SEEK_OSS_CI_GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: package.json

      - name: Install Dependencies
        run: pnpm i

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          publish-script: pnpm release
          github-token: ${{ secrets.SEEK_OSS_CI_GITHUB_TOKEN }}

      # changesets/action@v2 renamed `hasChangesets` to `has-changesets`.
      # Deploy after a publish, and when master has no pending changesets.
      - name: Build site
        if: steps.changesets.outputs.published == 'true' || steps.changesets.outputs['has-changesets'] == 'false'
        run: pnpm build:site
        env:
          BASE_NAME: /braid-design-system

      - name: Deploy site
        if: steps.changesets.outputs.published == 'true' || steps.changesets.outputs['has-changesets'] == 'false'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          folder: ./site/dist
          # Rebase onto concurrent preview commits. History is collapsed weekly
          # by the preview cleanup workflow, so this branch does not grow forever.
          force: false
          # Preserve the preview deployment folder and custom grad-connection site
          clean-exclude: |
            /preview/*
            /grad-connection/*
  snapshot:
    name: Publish snapshot version
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      CI: true
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          token: ${{ secrets.SEEK_OSS_CI_GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version-file: package.json

      - name: Install Dependencies
        run: pnpm i

      - name: Publish
        uses: seek-oss/changesets-snapshot@v1.0.0
        with:
          pre-publish: pnpm prepare-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
