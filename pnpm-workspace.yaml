allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
  nx: false
  sku: false
  unrs-resolver: true

# One supports-color, so Vitest is installed once. A second copy makes
# snapshot assertions run against a SnapshotClient that was never set up.
overrides:
  supports-color: 8.1.1

minimumReleaseAgeExclude:
  - '@capsizecss/*'
  - '@sku-lib/*'
  - '@vanilla-extract/*'
  - browserslist-config-seek
  - eslint-config-seek
  - sku
  - playroom

packageExtensions:
  babel-plugin-remove-unused-vars:
    peerDependencies:
      '@babel/types': '*'

packages:
  - packages/*
  - integration
  - storybook
  - site
